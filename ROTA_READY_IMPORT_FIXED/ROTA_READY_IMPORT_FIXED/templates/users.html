{% extends "base.html" %}{% block body %}<div class="hero"><h1>مستخدمو المدرسة</h1><p>{{users|length}} / {{limit}}</p>{% if message %}<div class="notice warn">{{message}}</div>{% endif %}</div><section class="card"><form method="post" class="grid"><input class="input" name="name" placeholder="الاسم" required><input class="input" name="username" placeholder="اسم المستخدم" required><input class="input" type="email" name="email" placeholder="الإيميل" required><input class="input" type="password" name="password" placeholder="كلمة مرور مؤقتة" required><select name="role"><option value="admin">إدارة</option><option value="editor">تعديل</option><option value="viewer">مشاهدة فقط</option></select><button class="btn">إضافة مستخدم</button></form></section><table><tr><th>الاسم</th><th>اسم المستخدم</th><th>الإيميل</th><th>الصلاحية</th></tr>{% for x in users %}<tr><td>{{x.name}}</td><td dir="ltr">@{{x.username}}</td><td>{{x.email}}</td><td>{{x.role}}</td></tr>{% endfor %}</table>{% endblock %}
