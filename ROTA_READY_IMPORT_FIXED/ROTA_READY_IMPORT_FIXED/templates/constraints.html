{% extends "base.html" %}{% block body %}<div class="hero"><h1>القيود</h1><p>كل قيد اختياري. القيود المرنة تحسن الجدول، والتعارض الحقيقي فقط يمنع الحفظ.</p></div><section class="card"><form method="post" action="/constraints/save"><div class="grid"><label><input type="checkbox" name="no_two_waiting_same_day" value="1" {% if cfg.get('no_two_waiting_same_day',{}).get('enabled') %}checked{% endif %}> عدم تكرار الانتظار للمعلمة في اليوم</label><label>أقصى انتظار بالأسبوع<input class="input" type="number" name="max_waiting_week" value="{{cfg.get('max_waiting_week',{}).get('value',2)}}"></label><label><input type="checkbox" name="avoid_three_consecutive" value="1" {% if cfg.get('avoid_three_consecutive',{}).get('enabled') %}checked{% endif %}> منع 3 حصص متتالية</label><label><input type="checkbox" name="spread_lessons" value="1" {% if cfg.get('spread_lessons',{}).get('enabled') %}checked{% endif %}> توزيع الحصص على الأسبوع</label><label><input type="checkbox" name="reduce_gaps" value="1" {% if cfg.get('reduce_gaps',{}).get('enabled') %}checked{% endif %}> تقليل الفراغات</label><label><input type="checkbox" name="balance_edge_periods" value="1" {% if cfg.get('balance_edge_periods',{}).get('enabled') %}checked{% endif %}> موازنة الأولى والسابعة</label><label><input type="checkbox" name="math_no_period7" value="1" {% if cfg.get('math_no_period7',{}).get('enabled') %}checked{% endif %}> الرياضيات بدون سابعة</label><label>أقصى سابعة لباقي المواد<input class="input" type="number" name="other_period7_max" value="{{cfg.get('other_period7_max',{}).get('value',2)}}"></label><label><input type="checkbox" name="art_digital_double" value="1" {% if cfg.get('art_digital_double',{}).get('enabled') %}checked{% endif %}> الفنية والرقمية حصتان متتاليتان</label><label><input type="checkbox" name="activity_constraints" value="1" {% if cfg.get('activity_constraints',{}).get('enabled') %}checked{% endif %}> تفعيل قيود النشاط</label></div><button class="btn">حفظ القيود</button></form></section><section class="card"><h3>قيد خاص لمعلمة</h3><form method="post" action="/constraint/specific" class="grid"><select name="teacher_id">{% for t in teachers %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select><select name="day">{% for d in days %}<option value="{{loop.index0}}">{{d}}</option>{% endfor %}</select><input class="input" type="number" min="1" max="7" name="period" value="1"><select name="level"><option value="hard">إلزامي</option><option value="soft">مفضل</option></select><button class="btn">إضافة</button></form><table><tr><th>المعلمة</th><th>اليوم</th><th>الحصة</th><th>المستوى</th><th></th></tr>{% for x in specific %}<tr><td>{{x.teacher_name}}</td><td>{{days[x.day]}}</td><td>{{x.period}}</td><td>{{x.level}}</td><td><form method="post" action="/constraint/delete/{{x.id}}"><button class="btn danger">حذف</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
