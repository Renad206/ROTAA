{% extends "base.html" %}{% block body %}<div class="otp-page"><section class="otp-card"><div class="brand big center">R</div><div class="eyebrow">EMAIL VERIFICATION</div><h2>{% if mode=='reset' %}استعادة كلمة المرور{% else %}تحقق من الإيميل{% endif %}</h2><p class="muted">أرسلنا رمزًا مؤقتًا من 6 أرقام إلى البريد المسجل. صلاحيته 5 دقائق.</p>{% if error %}<div class="message warn">{{error}}</div>{% endif %}<form method="post"><input class="otp-input" name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required><button class="btn full-btn">تحقق</button></form><form method="post" action="/verify/resend"><button class="text-btn" type="submit">إعادة إرسال الرمز</button></form><a class="back-login" href="/login">العودة لتسجيل الدخول</a></section></div>{% endblock %}
